# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu/nhóm = 42 nhân viên/nhóm;
#      tổng 84 > 40 nên không khả thi.
#   c) 20 nhân viên mỗi nhóm: n_eff tối đa < 20/0,02 = 1.000 < 1.251; không đủ cho +5 điểm.
#   d) 6 depot mỗi nhóm: n_eff tối đa < 6/0,02 = 300; không đạt và chỉ có 6 cụm/nhóm.
#   e) Mức chênh 6 điểm: 859 yêu cầu/nhóm; 20 nhân viên/nhóm cần m >= 299;
#      DE = 6,96 và n_eff = 859,2.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có; 20 nhân viên đối chứng chạy cùng tuần và cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code với seed chốt trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro trao đổi trong depot; giảm bằng quyền truy cập
#      theo staff_id và log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có; chỉ số, MDE, luật dừng
#      và ngày quyết định 2027-01-05 được ghi trước khi bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên/nhóm.
#
# Đánh đổi đã chấp nhận: chọn ngẫu nhiên theo nhân viên 20 + 20 để giảm tràn tác động;
# chỉ đủ power 0,80 cho +6 điểm. Nếu tác động thật chỉ +5 điểm thì power khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay: toàn mẫu 51/1.200 = 4,25%; phạm vi noi_dia + hang_nang
# là 39/982 = 3,97% (tính từ CSV). Luật an toàn so với đối chứng và dùng trần tuyệt đối 6%.
# Khả thi công suất (ước tính, không phải dữ liệu pilot đo thực tế): 1.500 yêu cầu/ngày / 40 = 37,5
# yêu cầu/người/ngày, nên 299 yêu cầu/người cần khoảng 7,97 ngày nếu phân bổ đều toàn bộ yêu cầu.
# Nếu ước tính theo tỷ trọng noi_dia + hang_nang trong mẫu (982/1.200 = 81,83%) thì cần khoảng
# 9,74 ngày. Phải đo lại lưu lượng đủ điều kiện và tải theo nhân viên khi chạy pilot.

pilot:
  owner: "Giám đốc vận hành LogiX-VN" # vai trò có quyền dừng; nguồn: bối cảnh đề bài
  scope: "Chỉ noi_dia và hang_nang tại 12 depot; loại quoc_te và doi_tac theo bằng chứng A3 [simulated]"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    stratified_by: "depot"
    randomization: "bốc thăm bằng code với seed chốt trước khi bắt đầu"
  # Rollout chính thức chỉ 3 bước; không dùng bước 0.75.
  rollout: [0.10, 0.25, 0.50]
  # 0.10/0.25: 1 tuần kiểm tra an toàn. 0.50: tối thiểu 2 tuần hoặc đến khi m>=299 (~9,74 ngày ước tính).
  rollout_step_days:
    "0.10": 7
    "0.25": 7
    "0.50": 14
  rollout_step_0_50_rule: "max(14 ngày lịch, thời gian đạt m>=299 yêu cầu đủ điều kiện/nhân viên); chỉ số chính chỉ trên mẫu chín"
  review_sampling_by_rollout:
    "0.10": "xem lại 100%"
    "0.25": "xem lại 50%"
    "0.50": "xem lại 20%"
  emergency_stop_clarification:
    duplicate_refund: "stop_immediately_on_first_case"
    reopen_vs_control_or_cap_6pct: "require_3_consecutive_days"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    requests_per_cluster_min: 299
    design_effect: 6.96
    effective_n_per_arm_at_minimum: 859.2
    clusters_per_arm: 20
    power_if_true_effect_is_0_05: 0.64
  capacity_feasibility:
    status: "ước tính khả thi về lưu lượng; chưa phải dữ liệu đo thực tế"
    all_requests_per_staff_day_estimate: 37.50
    days_for_299_all_requests_estimate: 7.97
    observed_scope_share: 0.8183
    eligible_requests_per_day_estimate: 1227.50
    days_for_299_in_observed_scope_estimate: 9.74
    assumptions: "1.500 yêu cầu/ngày, 40 nhân viên, phân bổ đều; phải đo lại tải và lưu lượng đủ điều kiện"
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy cùng tuần và cùng depot với 20 nhân viên can thiệp"
    spillover_risk: "có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo staff_id và log lượt mở trợ lý"
    predeclared: "chỉ số chính, MDE, cách chia, luật dừng và ngày quyết định được ghi trước khi bắt đầu"
  stop_rules:
    - "KHẨN CẤP–HOÀN TRÙNG: NẾU >= 1 ca hoàn tiền trùng (cùng request_id có >= 2 lần refund_ledger_write status=ok, hoặc thiếu idempotency_key) TRONG tức thì khi phát hiện THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và tạm dừng nhận yêu cầu mới bằng trợ lý. Nếu điều kiện NẾU không xảy ra THÌ được phép tiếp tục phục vụ bằng trợ lý."
    - "AN TOÀN–MỞ LẠI: NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm hoặc vượt trần tuyệt đối 6% TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và không sang bước rollout tiếp. Nếu điều kiện NẾU không xảy ra THÌ được phép sang bước rollout tiếp theo lịch."
    - "CHI PHÍ: NẾU chi phí mỗi việc thành công (phạm vi noi_dia+hang_nang) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy. Nếu điều kiện NẾU không xảy ra THÌ được phép giữ hang_nang trong phạm vi đã duyệt."
    - "SỬ DỤNG: NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và tạm dừng chuyển bước rollout. Nếu điều kiện NẾU không xảy ra THÌ được phép chuyển bước rollout theo lịch."
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "noi_dia: 2.696 đ/việc = 0,22x so với 12.000 đ"
    - "hang_nang: 8.221 đ/việc = 0,69x so với 12.000 đ"
    - "quoc_te: 22.515 đ/việc = 1,88x so với 12.000 đ"
    - "doi_tac: 10.215 đ/việc = 0,85x so với 12.000 đ"
